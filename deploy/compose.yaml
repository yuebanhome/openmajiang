name: openmajiang

x-app: &app
  image: ${OPENMAJIANG_IMAGE:?Set OPENMAJIANG_IMAGE in deploy/.env}
  environment: &app-environment
    HTTP_ADDR: ":8080"
    DATABASE_URL: "postgres://openmajiang:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/openmajiang?sslmode=disable"
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
    TOKEN_HASH_KEY: ${TOKEN_HASH_KEY:?Generate TOKEN_HASH_KEY using openssl rand -base64 32}
    AUTH_MAIL_KEY: ${AUTH_MAIL_KEY:?Generate AUTH_MAIL_KEY using openssl rand -base64 32}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    SMTP_ADDR: ${SMTP_ADDR:?Set SMTP_ADDR}
    SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: openmajiang
      POSTGRES_DB: openmajiang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U openmajiang -d openmajiang"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  app:
    <<: *app
    command: [serve]
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 90s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    profiles: [dev-mail]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres-data:
